name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install deployment dependency
        run: python -m pip install --upgrade huggingface_hub
      - name: Upload application to the existing Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python deploy/upload.py --user Nischalpatil --only space --reuse
