name: Publish application to a selected Space

on:
  push:
    branches:
      - covid-files
    paths:
      - 'pipeline/**'
      - 'deploy/**'
      - 'requirements.txt'
      - '.github/workflows/sync-to-huggingface.yml'
  workflow_dispatch:
    inputs:
      space_repo:
        description: 'Separate destination Space (owner/name)'
        required: false
        default: ''
        type: string
      data_repo:
        description: 'Dataset repository (owner/name)'
        required: false
        default: ''
        type: string
      data_revision:
        description: 'Immutable 40-character dataset commit'
        required: false
        default: ''
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Validate deployment settings
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TARGET_SPACE: ${{ inputs.space_repo || vars.PUBMED_SPACE_REPO || 'Nischalpatil/pubmed-ai' }}
          DATA_REPO: ${{ inputs.data_repo || vars.PUBMED_DATA_REPO }}
          DATA_REVISION: ${{ inputs.data_revision || vars.PUBMED_DATA_REVISION }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          for name in HF_TOKEN TARGET_SPACE; do
            if [ -z "${!name}" ]; then
              echo "Missing required GitHub secret or Actions variable: $name"
              exit 1
            fi
          done
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && { [ -n "$DATA_REPO" ] || [ -n "$DATA_REVISION" ]; }; then
            if [ -z "$DATA_REPO" ] || [ -z "$DATA_REVISION" ]; then
              echo "Set both PUBMED_DATA_REPO and PUBMED_DATA_REVISION, or leave both blank to keep the Space's current dataset configuration."
              exit 1
            fi
          fi
          if [ -n "$DATA_REVISION" ] && ! [[ "$DATA_REVISION" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "PUBMED_DATA_REVISION must be the exact 40-character dataset commit."
            exit 1
          fi
      - name: Install deployment dependency
        run: python -m pip install --upgrade huggingface_hub
      - name: Upload application to the selected Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PUBMED_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PUBMED_LLM: cloud
          PUBMED_ALLOW_CLOUD: '1'
          PUBMED_API_BASE: https://api.groq.com/openai/v1
          PUBMED_CLOUD_MODEL: openai/gpt-oss-120b
          TARGET_SPACE: ${{ inputs.space_repo || vars.PUBMED_SPACE_REPO || 'Nischalpatil/pubmed-ai' }}
          DATA_REPO: ${{ inputs.data_repo || vars.PUBMED_DATA_REPO }}
          DATA_REVISION: ${{ inputs.data_revision || vars.PUBMED_DATA_REVISION }}
        run: |
          # Routine code deployments keep using the exact dataset revision
          # already configured on the Space. Pass data coordinates only when
          # an operator explicitly provides both during manual dispatch.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ -n "$DATA_REPO" ] && [ -n "$DATA_REVISION" ]; then
            python deploy/upload.py --space-repo "$TARGET_SPACE" --data-repo "$DATA_REPO" --data-revision "$DATA_REVISION"
          else
            python deploy/upload.py --space-repo "$TARGET_SPACE"
          fi
